<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Rayner Dcunha</title>
  <desc id="d">Computer Engineering Co-Op at the University of Alberta. Builds with Python, SQL, Kotlin, React, JavaScript, Node.js and FastAPI. Live to learn.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>

    <!-- Typing reveal masks: one per line, 18s loop, each line gets a 6s slot -->
    <clipPath id="c1">
      <rect x="58" y="145" height="30" width="0">
        <animate attributeName="width" dur="18s" repeatCount="indefinite"
                 keyTimes="0;0.09;0.27;0.3333;1" values="0;510;510;0;0"/>
      </rect>
    </clipPath>
    <clipPath id="c2">
      <rect x="58" y="145" height="30" width="0">
        <animate attributeName="width" dur="18s" repeatCount="indefinite"
                 keyTimes="0;0.3333;0.4233;0.6033;0.6667;1" values="0;0;694;694;0;0"/>
      </rect>
    </clipPath>
    <clipPath id="c3">
      <rect x="58" y="145" height="30" width="0">
        <animate attributeName="width" dur="18s" repeatCount="indefinite"
                 keyTimes="0;0.6667;0.7567;0.9367;1" values="0;0;133;133;0"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect width="800" height="220" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="799" height="219" rx="13.5" fill="none" stroke="#30363d"/>

  <!-- Window dots + tiny title -->
  <circle cx="28" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="26" r="6" fill="#27c93f"/>
  <text x="90" y="30" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8b949e">rayner@github ~</text>

  <!-- Online status (pulsing dot) -->
  <circle cx="712" cy="26" r="5" fill="#3fb950" opacity="0.5">
    <animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="712" cy="26" r="5" fill="#3fb950"/>
  <text x="726" y="30" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#3fb950">Online</text>

  <!-- Soft floating code glyph -->
  <text x="690" y="120" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="96" font-weight="700" fill="#58a6ff" opacity="0.12">
    &lt;/&gt;
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Name -->
  <text x="40" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f0f6fc" opacity="0">
    Rayner Dcunha
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
  </text>
  <rect x="40" y="108" width="0" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" from="0" to="140" dur="0.9s" begin="0.2s" fill="freeze"/>
  </rect>

  <!-- Prompt + typed lines -->
  <text x="40" y="165" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#3fb950">&gt;</text>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#c9d1d9">
    <text x="58" y="165" textLength="510" lengthAdjust="spacingAndGlyphs" clip-path="url(#c1)">Computer Engineering Co-Op @ University of Alberta</text>
    <text x="58" y="165" textLength="694" lengthAdjust="spacingAndGlyphs" clip-path="url(#c2)">Build using Python, SQL, Kotlin, React, JavaScript, Node.js, FastAPI</text>
    <text x="58" y="165" textLength="133" lengthAdjust="spacingAndGlyphs" clip-path="url(#c3)">Live to Learn</text>
  </g>

  <!-- Cursor follows the typing -->
  <rect x="61" y="148" width="9" height="22" fill="#58a6ff">
    <animate attributeName="x" dur="18s" repeatCount="indefinite"
             keyTimes="0;0.09;0.27;0.3333;0.4233;0.6033;0.6667;0.7567;0.9367;1"
             values="61;571;571;61;755;755;61;194;194;61"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
